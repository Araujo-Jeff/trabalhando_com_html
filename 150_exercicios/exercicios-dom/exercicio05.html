<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tabuada de um numero</title>
    <!-- Crie uma página que exiba a tabuada de um número inserido pelo usuário, utilizando loops. -->
  </head>
  <body>
    <div>
      <h1>Tabuada do numero escolhido</h1>
      <label for="numero">Digete um numero</label>
      <input type="number" id="numero" placeholder="Digite aqui..." />
      <button onclick="gerar()">Gerar</button>
      <p id="resultado"></p>
    </div>

    <script>
      function gerar() {
        const numero = parseInt(document.getElementById('numero').value);
        const resultado = document.getElementById('resultado');
        let respostaResultado = ' ';
        for (tabuada = 1; tabuada <= 10; tabuada++) {
          respostaResultado += `${numero} x ${tabuada} = ${
            numero * tabuada
          } <br>`;
        }
        resultado.innerHTML = respostaResultado;
      }
    </script>
  </body>
</html>
