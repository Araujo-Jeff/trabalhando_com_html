<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Numeros Primos</title>
    <!-- Crie uma página que verifique se um número é primo. 
    O usuário deve inserir um número e a página deve exibir se ele é primo ou não. -->
  </head>
  <body>
    <h1>Numeros Primo</h1>
    <div>
      <label for="numero">Digite um numero</label>
      <input type="number" id="numero" placeholder="Digite aqui..." />
      <button onclick="primo()">Resultado</button>
      <p id="resultado"></p>
    </div>

    <script>
      function primo() {
        const numero = parseInt(document.getElementById('numero').value);

        if (numero < 2) {
          return (document.getElementById(
            'resultado'
          ).innerText = `${numero} Não é um numero primo.`);
        }
        for (let i = 2; i < numero; i++) {
          if (numero % i === 0) {
            return (document.getElementById(
              'resultado'
            ).innerText = `${numero} Não é um numero primo.`);
          }
        }
        return (document.getElementById(
          'resultado'
        ).innerText = `${numero} é um numero primo.`);
      }
    </script>
  </body>
</html>
